[greeter]
background=/usr/share/backgrounds/mineos/scarlet-tree.png
user-background=false
theme-name=MineOS-Greeter
icon-theme-name=Papirus-Dark
cursor-theme-name=Adwaita
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=none
position=50%,center 52%,center
default-user-image=/usr/share/backgrounds/mineos/account.svg
round-user-image=false
panel-position=top
clock-format=%a, %d %b   %H:%M
indicators=~spacer;~session;~language;~layout;~a11y;~clock;~power
