services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mineos_remote
      POSTGRES_PASSWORD: "5m4a42XNN3Jnfdm5wrxTrVOS0K4a2WGK"
    volumes:
      - mineos_remote_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "BTrFuaqKYZlFPKftttdkBH1xh4qMOy5h"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mineos_remote_test
      POSTGRES_PASSWORD: "ndM8gO_bSEYDuEsj5YDiiFCZD4yh6pc6"
    volumes:
      - mineos_remote_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "VlFBvNv_VBjq-4FpoKud4vMPTggK7wo6"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  mineos_remote_data:
  mineos_remote_test_data:
