name: Build MineOS ISOs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'VERSION'
      - 'scripts/build-iso.sh'
      - 'scripts/install-iso-features.sh'
      - 'scripts/build-mino-code.sh'
      - 'scripts/build-code-engine.sh'
      - 'scripts/boot-test.sh'
      - 'config/**'
      - 'branding/**'
      - 'desktop/**'
      - 'ai/**'
      - 'ide/**'
      - 'rootfs/**'

permissions:
  contents: read

jobs:
  build:
    name: MineOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MINEOS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native build tools
        run: |
          test "$(dpkg --print-architecture)" = "$MINEOS_ARCH"
          version=$(tr -d '[:space:]' < VERSION)
          echo "MINEOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINEOS_BUILD_ID=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq zstd python3-pip

      # The runner ships SDKs and Docker images this build never uses. The AI
      # makes the ISO about 3 GB, and building it needs room for the models,
      # the unpacked system, its squashfs and the ISO.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Unit test the terminal assistant
        run: python3 -m unittest discover -s ai/tests -t ai -v

      - name: Fetch verified offline model and inference engine
        run: bash ai/fetch-offline-ai.sh "$RUNNER_TEMP/mineos-ai"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compile both Mino Code runtimes
        run: |
          bash scripts/build-mino-code.sh "$MINEOS_ARCH"
          bash scripts/build-code-engine.sh "$MINEOS_ARCH"

      - name: Build and validate ISO
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "$PWD:/src" -v "$RUNNER_TEMP/mineos-ai:/mineos-ai:ro" -w /src \
            -e MINEOS_AI_DIR=/mineos-ai \
            -e MINEOS_BUILD_ID \
            debian:13 bash scripts/build-iso.sh "/src/dist/MineOS-$MINEOS_VERSION-$MINEOS_ARCH.iso"
          (
            cd dist
            sha256sum "MineOS-$MINEOS_VERSION-$MINEOS_ARCH.iso" > "MineOS-$MINEOS_VERSION-$MINEOS_ARCH.iso.sha256"
            sha256sum -c "MineOS-$MINEOS_VERSION-$MINEOS_ARCH.iso.sha256"
          )

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MineOS-${{ env.MINEOS_VERSION }}-${{ matrix.arch }}
          path: dist/MineOS-${{ env.MINEOS_VERSION }}-${{ matrix.arch }}.iso*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      # Runs after the upload so a failing ISO can still be downloaded and inspected.
      # GitHub's arm64 runners have no KVM, so only amd64 is boot-tested.
      - name: Boot test in QEMU
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash scripts/boot-test.sh "dist/MineOS-$MINEOS_VERSION-amd64.iso" boot-test.log

      - name: Upload boot log
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log-amd64
          path: boot-test.log
          if-no-files-found: ignore
          retention-days: 14
