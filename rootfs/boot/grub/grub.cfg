set default=0
set timeout=5

menuentry "MineOS" {
    linux /live/vmlinuz boot=live components username=mineos hostname=mineos quiet splash
    initrd /live/initrd.img
}

menuentry "MineOS (Safe Mode)" {
    linux /live/vmlinuz boot=live components username=mineos hostname=mineos nomodeset
    initrd /live/initrd.img
}
