backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
glx-use-copysubbuffermesa = false;
glx-no-rebind-pixmap = true;
use-damage = true;
xrender-sync-fence = true;

vsync = true;
unredir-if-possible = false;

shadow = true;
shadow-radius = 18;
shadow-offset-x = -18;
shadow-offset-y = -6;
shadow-opacity = 0.55;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Plank'",
  "class_g = 'tint2'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'firefox' && argb",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;
no-fading-openclose = false;

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:class_g = 'Plank'",
  "100:class_g = 'tint2'",
  "97:class_g = 'AI Assistant'"
];

blur-background = false;

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

log-level = "error";
