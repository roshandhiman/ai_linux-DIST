backend = "glx";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = ${shadow_radius};
shadow-opacity = ${shadow_opacity};
shadow-offset-x = ${shadow_x};
shadow-offset-y = ${shadow_y};
fading = false;
blur-method = "none";
blur-strength = ${blur_strength};
blur-background = false;

rules = (
    {
        match = "window_type = 'normal' && !fullscreen";
        corner-radius = ${regular_corner};
    },
    {
        match = "window_type = 'desktop' || window_type = 'dock' || fullscreen || name = 'MineOS Companion' || _GTK_FRAME_EXTENTS";
        shadow = false;
    },
    {
        match = "!fullscreen && (class_i = 'mineos-applications' || class_i = 'mineos-settings' || class_i = 'mine-ai' || class_i = 'plank')";
        blur-background = true;
    },
    {
        match = "!fullscreen && (class_i = 'mineos-applications' || class_i = 'mineos-settings')";
        corner-radius = ${window_corner};
        shadow = true;
    },
    {
        match = "!fullscreen && (window_type = 'normal' || window_type = 'dialog' || class_i = 'mineos-applications')";
        animations = (
            { triggers = ["open", "show"]; preset = "appear"; scale = 0.975; duration = ${motion_seconds}; },
            { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.985; duration = ${motion_seconds}; }
        );
    }
);
log-level = "warn";
