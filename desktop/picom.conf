backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "name = 'MineOS Companion'", "_GTK_FRAME_EXTENTS"];
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 8;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 6;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'"];
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-exclude = ["window_type = 'desktop'", "class_g = 'Plank'", "name = 'MineOS Companion'"];
log-level = "warn";
