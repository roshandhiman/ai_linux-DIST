backend = "xrender";
vsync = true;
use-damage = true;
unredir-if-possible = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "name = 'MineOS Companion'", "_GTK_FRAME_EXTENTS"];
fading = true;
fade-in-step = 0.16;
fade-out-step = 0.20;
fade-delta = 12;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 12;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "name = 'MineOS Companion'"];
blur-method = "none";
blur-size = 2;
blur-background = false;
# Limit optional blur to the app launcher. Settings and Assistant use translucent GTK surfaces.
blur-background-exclude = ["class_g != 'MineOSApplications'"];
log-level = "warn";
