backend = "glx";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.26;
shadow-offset-x = -11;
shadow-offset-y = -8;
fading = false;
blur-method = "none";
blur-strength = 4;
blur-background = false;

rules = (
    {
        match = "window_type = 'normal' && !fullscreen";
        corner-radius = 12;
    },
    {
        match = "window_type = 'desktop' || window_type = 'dock' || fullscreen || name = 'MineOS Companion' || _GTK_FRAME_EXTENTS";
        shadow = false;
    },
    {
        match = "!fullscreen && (class_i = 'mineos-applications' || class_i = 'mineos-settings' || class_i = 'mine-ai' || class_i = 'plank')";
        blur-background = true;
    },
    {
        match = "!fullscreen && (window_type = 'normal' || window_type = 'dialog' || class_i = 'mineos-applications')";
        animations = (
            { triggers = ["open", "show"]; preset = "appear"; scale = 0.975; duration = 0.18; },
            { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.985; duration = 0.14; }
        );
    }
);
log-level = "warn";
